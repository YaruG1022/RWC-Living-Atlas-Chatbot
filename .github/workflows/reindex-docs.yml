name: Sync published app manual

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [atlas-manual-published]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Published app commit (empty uses the currently published version)'
        required: false

permissions:
  contents: read

# All writers serialize. Never cancel a writer while its active pointer propagates.
concurrency:
  group: pinecone-manual-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
      - name: Import, verify and activate the published app release
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ vars.PINECONE_INDEX }}
          PINECONE_INDEX_HOST: ${{ vars.PINECONE_INDEX_HOST }}
          PINECONE_EMBED_MODEL: ${{ vars.PINECONE_EMBED_MODEL }}
          MANUAL_BASE_URL: ${{ vars.MANUAL_BASE_URL || 'https://rwc-living-atlas.netlify.app' }}
          EXPECTED_REVISION: ${{ github.event.client_payload.revision || inputs.revision }}
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
          EXPECTED_CHECKSUM: ${{ github.event.client_payload.checksum }}
        run: |
          set -euo pipefail
          python scripts/index_docs.py --activate

  release-evaluation:
    needs: sync
    # One sequential release evaluation per service publication/operator run, not on the
    # recurring reconciliation schedule (which must not generate chat charges).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-evaluation.yml
    with:
      ids: ''
      require_vision: true
