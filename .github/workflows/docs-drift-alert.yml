# Retained temporarily so old app deployments cannot overwrite the new manual index.
name: Ignore retired legacy docs notifications
on:
  repository_dispatch:
    types: [atlas-docs-changed]
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy docs notification ignored; only atlas-manual-published imports the current app manual."
